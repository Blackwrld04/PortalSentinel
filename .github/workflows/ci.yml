name: PortalSentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts:
    name: Smart Contracts Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge Tests
        working-directory: contracts
        run: |
          forge --version
          forge test -vvv

  daemon:
    name: Sentinel Daemon & CLI Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: daemon/package-lock.json

      - name: Install Dependencies
        working-directory: daemon
        run: npm ci

      - name: Typecheck & Build
        working-directory: daemon
        run: npm run build

      - name: Unit Tests
        working-directory: daemon
        run: npm test

      - name: Test Simulation (integration smoke, public RPC)
        working-directory: daemon
        # Depends on the public Portaldot testnet RPC, so do not block builds on it.
        continue-on-error: true
        run: npm run simulate

  frontend:
    name: Frontend Telemetry Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Dashboard
        working-directory: frontend
        run: npm run build

  containers:
    name: Container Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: portalsentinel-daemon:ci

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: false
          tags: portalsentinel-dashboard:ci
