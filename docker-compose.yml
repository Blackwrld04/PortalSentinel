version: "3.8"

services:
  portal-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-sentinel-daemon
    restart: unless-stopped
    environment:
      - PORTALDOT_RPC_URL=https://test-evm-rpc-v3.portaldot.dev
      - PORTALDOT_CHAIN_ID=420420777
      - SENTINEL_REGISTRY_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - DEFENSE_EXECUTOR_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - GUARDIAN_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_ALERTS_ENABLED=true
    ports:
      - "3002:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "daemon/dist/cli.js", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
